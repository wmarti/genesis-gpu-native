name: GENESIS explorer

on:
  push:
    branches: [main]
    paths:
      - 'docs/explorer/**'
      - 'doc/images/explorer-components/**'
      - 'doc/images/gpu-native-architecture.svg'
      - 'README.md'
      - 'scripts/*explorer*.py'
      - 'scripts/*explorer*.js'
      - '.github/workflows/explorer-pages.yml'
  pull_request:
    paths:
      - 'docs/explorer/**'
      - 'doc/images/explorer-components/**'
      - 'doc/images/gpu-native-architecture.svg'
      - 'README.md'
      - 'scripts/*explorer*.py'
      - 'scripts/*explorer*.js'
      - '.github/workflows/explorer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          for (const directory of ['docs/explorer', 'docs/explorer/source-files']) {
            for (const file of fs.readdirSync(directory).filter(file => file.endsWith('.js'))) {
              const filename = path.join(directory, file);
              new vm.Script(fs.readFileSync(filename, 'utf8'), { filename });
            }
          }
          NODE
      - name: Verify navigation and source deep links
        run: node --test scripts/test_explorer_navigation.js
      - name: Verify clickable architecture diagrams
        run: python3 scripts/build_explorer_diagrams.py --check
      - name: Version browser assets for consistent updates
        run: |
          python3 <<'PY'
          import hashlib
          import re
          from pathlib import Path

          site = Path('docs/explorer')
          entry = site / 'index.html'
          def version(match):
              attribute, filename = match.groups()
              digest = hashlib.sha256((site / filename).read_bytes()).hexdigest()[:16]
              return f'{attribute}="./{filename}?v={digest}"'
          entry.write_text(re.sub(r'(src|href)="\./([^"?]+\.(?:js|css))"', version, entry.read_text()))
          PY
      - name: Verify complete source files, links, measurements, and assets
        run: python3 scripts/check_explorer.py
      - name: Upload static website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/explorer

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
